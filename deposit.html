<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Alke Wallet - Depositar</title>

	<!-- Bootstrap 5.3.8 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Bootstrap Icons -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Estilos -->
	<link rel="stylesheet" href="assets/css/stylesheet.css">

</head>

<body class="bodyDeposit">

	<!-- Navbar -->

	<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

		<div class="container">

			<a class="navbar-brand fw-bold" href="menu.html">
				💳 Alke Wallet
			</a>

		</div>

	</nav>

	<!-- Contenido -->

	<div class="container">

		<div class="card shadow-lg border-0 deposit-card">

			<div class="card-body p-5">

				<div class="text-center mb-4">

					<i class="bi bi-cash-stack money-icon"></i>

					<h2 class="mt-3">
						Realizar Depósito
					</h2>

					<p class="text-muted">
						Ingresa el monto que deseas agregar a tu cuenta.
					</p>

				</div>

				<!-- Saldo actual -->

				<div class="alert alert-primary text-center">

					Saldo actual:
					<strong id="currentBalance">
						$0
					</strong>

				</div>

				<form id="depositForm">

					<div class="mb-3">

						<label for="depositAmount" class="form-label">
							Monto a depositar
						</label>

						<div class="input-group">

							<span class="input-group-text">
								$
							</span>

							<input
								type="number"
								class="form-control"
								id="depositAmount"
								placeholder="Ingrese el monto"
								min="1"
								required>

						</div>

					</div>

					<div class="d-grid gap-2">

						<button type="submit" class="btn btn-success btn-lg">

							Realizar Depósito

						</button>

						<a href="menu.html" class="btn btn-outline-secondary">

							Volver al Menú Principal

						</a>

					</div>

				</form>

				<!-- Alertas Bootstrap dinámicas -->

				<div id="alert-container" class="mt-4"></div>

				<!-- Monto depositado -->

				<div class="mt-3 text-center">

					<p id="depositInfo" class="fw-bold text-success"></p>

				</div>

			</div>

		</div>

	</div>

	<!-- jQuery -->

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<!-- JS -->

	<script src="./assets/js/deposit.js"></script>

</body>

</html>
