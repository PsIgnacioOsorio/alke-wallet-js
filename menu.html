<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Alke Wallet - Menú Principal</title>

	<!-- Bootstrap 5.3.8 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>

	<!-- Bootstrap Icons -->
	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

	<!-- Estilos -->
	<link rel="stylesheet" href="assets/css/stylesheet.css">

</head>

<body class="bodyMenu">

	<!-- Navbar -->

	<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

		<div class="container">

			<a class="navbar-brand fw-bold" href="#">
				💳 Alke Wallet
			</a>

			<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
				data-bs-target="#navbarMenu">

				<span class="navbar-toggler-icon"></span>

			</button>

			<div class="collapse navbar-collapse" id="navbarMenu">

				<ul class="navbar-nav ms-auto">

					<li class="nav-item">
						<a class="nav-link active" href="menu.html">
							Inicio
						</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="login.html">
							Cerrar Sesión
						</a>
					</li>

				</ul>

			</div>

		</div>

	</nav>

	<!-- Contenido -->

	<div class="container py-5">

		<h1 class="text-center mb-4">
			Menú Principal
		</h1>

		<!-- Alertas -->

		<div id="alertContainer"></div>

		<!-- Saldo -->

		<div class="card balance-card shadow-lg border-0 mb-5">

			<div class="card-body text-center p-4">

				<h5>
					Saldo Disponible
				</h5>

				<h1 class="display-4 fw-bold" id="balance">
					$0
				</h1>

			</div>

		</div>

		<!-- Opciones -->

		<div class="row g-4">

			<div class="col-md-4">

				<a href="#" id="btnDepositar" class="text-decoration-none">

					<div class="card menu-card shadow h-100">

						<div class="card-body text-center">

							<i class="bi bi-cash-coin icon-size text-success"></i>

							<h4 class="mt-3">
								Depositar
							</h4>

							<p class="text-muted">
								Agrega fondos a tu cuenta.
							</p>

						</div>

					</div>

				</a>

			</div>

			<div class="col-md-4">

				<a href="#" id="btnEnviar" class="text-decoration-none">

					<div class="card menu-card shadow h-100">

						<div class="card-body text-center">

							<i class="bi bi-send-fill icon-size text-primary"></i>

							<h4 class="mt-3">
								Enviar Dinero
							</h4>

							<p class="text-muted">
								Realiza transferencias.
							</p>

						</div>

					</div>

				</a>

			</div>

			<div class="col-md-4">

				<a href="#" id="btnMovimientos" class="text-decoration-none">

					<div class="card menu-card shadow h-100">

						<div class="card-body text-center">

							<i class="bi bi-clock-history icon-size text-warning"></i>

							<h4 class="mt-3">
								Movimientos
							</h4>

							<p class="text-muted">
								Consulta tu historial.
							</p>

						</div>

					</div>

				</a>

			</div>

		</div>

	</div>

	<!-- jQuery -->

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<!-- JS -->

	<script src="./assets/js/menu.js"></script>

</body>

</html>
