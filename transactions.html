<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Alke Wallet - Últimos Movimientos</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

	<link rel="stylesheet" href="assets/css/stylesheet.css">

</head>

<body class="bodyTransactions">

	<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

		<div class="container">

			<a class="navbar-brand fw-bold" href="menu.html">
				💳 Alke Wallet
			</a>

		</div>

	</nav>

	<div class="container">

		<div class="card shadow-lg border-0 movements-card">

			<div class="card-body p-4">

				<div class="text-center mb-4">

					<i class="bi bi-clock-history text-warning fs-1"></i>

					<h2 class="mt-3">
						Últimos Movimientos
					</h2>

					<p class="text-muted">
						Revisa el historial reciente de tu cuenta.
					</p>

				</div>

				<!-- FILTRO -->

				<div class="mb-4">

					<label class="form-label">
						Filtrar movimientos
					</label>

					<select
						id="filtroMovimientos"
						class="form-select">

						<option value="Todos">
							Todos
						</option>

						<option value="Depósito">
							Depósitos
						</option>

						<option value="Transferencia">
							Transferencias
						</option>

					</select>

				</div>

				<div class="table-responsive">

					<table class="table table-hover align-middle">

						<thead class="table-primary">

							<tr>

								<th>Tipo</th>

								<th>Descripción</th>

								<th>Fecha</th>

								<th>Monto</th>

							</tr>

						</thead>

						<tbody id="transactionsBody">

						</tbody>

					</table>

				</div>

				<div class="row mt-4 g-3">

					<div class="col-md-6">

						<div class="card border-success">

							<div class="card-body text-center">

								<h6 class="text-success">
									Ingresos
								</h6>

								<h4 id="totalIngresos">
									$0
								</h4>

							</div>

						</div>

					</div>

					<div class="col-md-6">

						<div class="card border-danger">

							<div class="card-body text-center">

								<h6 class="text-danger">
									Egresos
								</h6>

								<h4 id="totalEgresos">
									$0
								</h4>

							</div>

						</div>

					</div>

				</div>

				<div class="d-grid mt-4">

					<a href="menu.html" class="btn btn-outline-secondary">

						<i class="bi bi-arrow-left"></i>

						Volver al Menú Principal

					</a>

				</div>

			</div>

		</div>

	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<script src="./assets/js/transactions.js"></script>

</body>

</html>
