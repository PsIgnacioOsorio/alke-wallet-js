<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Enviar Dinero</title>

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- Estilos -->
  <link rel="stylesheet" href="assets/css/stylesheet.css">

</head>

<body class="bodySendmoney">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
      <a class="navbar-brand fw-bold" href="menu.html">
        💳 Alke Wallet
      </a>
    </div>
  </nav>

  <div class="container">

    <div class="card shadow-lg border-0 transfer-card">

      <div class="card-body p-4">

        <div id="alertContainer"></div>

        <div class="alert alert-info mb-3">
          Saldo disponible:
          <strong id="saldoActual">$0</strong>
        </div>

        <div class="text-center mb-4">

          <i class="bi bi-send-fill text-primary fs-1"></i>

          <h2 class="mt-3">
            Enviar Dinero
          </h2>

          <p class="text-muted">
            Selecciona un contacto o agrega uno nuevo.
          </p>

        </div>

        <div class="mb-4">

          <label for="searchContact" class="form-label">
            Buscar en agenda
          </label>

          <input type="text" class="form-control" id="searchContact" list="contactos" placeholder="Buscar contacto">

          <datalist id="contactos">

            <option value="John Doe">

            <option value="Jane Smith">

          </datalist>

        </div>

        <div class="d-grid mb-4">

          <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#contactModal">

            <i class="bi bi-person-plus-fill"></i>
            Agregar Nuevo Contacto

          </button>

        </div>

        <div class="list-group mb-4" id="contactList">

          <div class="list-group-item">

            <input class="form-check-input me-2" type="radio" name="contact" value="John Doe">

            John Doe

            <br>

            <small class="text-muted">
              CBU: 123456789 |
              Alias: john.doe |
              Banco: ABC Bank
            </small>

          </div>

          <div class="list-group-item">

            <input class="form-check-input me-2" type="radio" name="contact" value="Jane Smith">

            Jane Smith

            <br>

            <small class="text-muted">
              CBU: 987654321 |
              Alias: jane.smith |
              Banco: XYZ Bank
            </small>

          </div>

        </div>

        <form id="transferForm">

          <div class="mb-3">

            <label for="amount" class="form-label">
              Monto a transferir
            </label>

            <div class="input-group">

              <span class="input-group-text">
                $
              </span>

              <input type="number" class="form-control" id="amount" placeholder="Ingrese monto" required>

            </div>

          </div>

          <div class="d-grid gap-2">

            <button type="submit" class="btn btn-primary btn-lg d-none" id="btnEnviarDinero">

              <i class="bi bi-send-check-fill"></i>
              Enviar Dinero

            </button>

            <a href="menu.html" class="btn btn-outline-secondary">

              <i class="bi bi-arrow-left"></i>
              Volver al Menú Principal

            </a>

          </div>

        </form>

        <div class="alert alert-success mt-3 d-none" id="transferMessage">
        </div>

      </div>

    </div>

  </div>

  <!-- Modal Nuevo Contacto -->

  <div class="modal fade" id="contactModal" tabindex="-1">

    <div class="modal-dialog">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">
            Nuevo Contacto
          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal">
          </button>

        </div>

        <div class="modal-body">

          <form id="contactForm">

            <input type="text" id="contactName" class="form-control mb-3" placeholder="Nombre y apellido" required>

            <input type="text" id="contactCBU" class="form-control mb-3" placeholder="Número de CBU" required>

            <input type="text" id="contactAlias" class="form-control mb-3" placeholder="Alias" required>

            <input type="text" id="contactBank" class="form-control" placeholder="Nombre del Banco" required>

          </form>

        </div>

        <div class="modal-footer">

          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

            Cancelar

          </button>

          <button type="button" class="btn btn-primary" id="saveContact">

            Guardar Contacto

          </button>

        </div>

      </div>

    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script src="./assets/js/sendmoney.js"></script>

</body>

</html>
